substitutions:
  _IMAGE_NAME: sprout-menu
  _REGION: me-central1
  _REGISTRY: me-central1-docker.pkg.dev/sandbox-community/sandbox-community
  _CLUSTER: sandbox-cluster
  _CLUSTER_ZONE: me-central1-a
  _NAMESPACE: default
  _DEPLOYMENT: sprout-menu

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGISTRY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - -t
      - ${_REGISTRY}/${_IMAGE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/${_IMAGE_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - set
      - image
      - deployment/${_DEPLOYMENT}
      - ${_IMAGE_NAME}=${_REGISTRY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --namespace=${_NAMESPACE}
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}

options:
  logging: CLOUD_LOGGING_ONLY
